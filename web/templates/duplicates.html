{{define "content"}}
<div class="mb-8">
  <div class="flex items-center gap-2 mb-4 font-mono text-sm">
    <a href="/zones" class="text-gray-500 hover:text-connection-blue transition-colors flex items-center gap-1">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Zones
    </a>
    <span class="text-gray-300">/</span>
    <span class="text-asphalt-dark font-bold">Duplicates</span>
  </div>

  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-200 pb-6">
    <div>
      <h2 class="text-3xl font-branding font-bold text-asphalt-dark">Duplicate Records</h2>
      <p class="text-gray-500 mt-1">Records with identical values across all managed zones</p>
    </div>
    <div class="flex items-center gap-3">
      <div id="counters-container" class="flex items-center gap-2">
        <span id="counter-total" class="bg-gray-100 text-gray-600 text-xs font-bold px-3 py-1 rounded-full border border-gray-200 animate-pulse w-24 h-6"></span>
        <span id="counter-ignored" class="bg-gray-50 text-gray-400 text-xs font-bold px-3 py-1 rounded-full border border-gray-200 animate-pulse w-24 h-6"></span>
      </div>
      <form method="POST" action="/admin/duplicates/reset" class="inline" onsubmit="return confirm('Reset all ignored duplicates?')">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <button type="submit" title="Reset all ignored duplicates"
          class="bg-white border border-gray-300 hover:border-red-400 text-gray-700 hover:text-red-500 p-2 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm font-semibold">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset Ignores
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Search (Hidden initially) -->
<div id="search-container" class="mb-6 hidden">
  <div class="relative group">
    <i data-lucide="search"
      class="w-5 h-5 text-gray-400 group-focus-within:text-connection-blue absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none transition-colors"></i>
    <input type="text" id="duplicate-search" placeholder="Filter by value, name, or type..."
      class="w-full border border-gray-300 rounded-lg p-3 pl-12 font-mono text-sm bg-white focus:outline-none focus:ring-2 focus:ring-connection-blue/50 focus:border-connection-blue placeholder-gray-400 transition-all"
      oninput="filterDuplicates(this.value)">
  </div>
</div>

<!-- Skeletons -->
<div id="skeleton-container" class="grid grid-cols-1 gap-6">
  {{range (seq 3)}}
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 space-y-4 animate-pulse">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gray-100 rounded-lg"></div>
      <div class="space-y-2 flex-1">
        <div class="h-3 bg-gray-100 rounded w-24"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
      </div>
    </div>
    <div class="space-y-3 pt-4 border-t border-gray-50">
      <div class="h-10 bg-gray-50 rounded w-full"></div>
      <div class="h-10 bg-gray-50 rounded w-full"></div>
    </div>
  </div>
  {{end}}
</div>

<!-- Main List -->
<div class="grid grid-cols-1 gap-6 hidden" id="duplicates-list"></div>

<!-- Empty Results -->
<div id="no-search-results" class="hidden bg-white rounded-xl border border-gray-200 p-12 text-center shadow-sm">
  <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-50 rounded-full mb-4">
    <i data-lucide="search-x" class="w-8 h-8 text-gray-400"></i>
  </div>
  <h3 class="text-lg font-branding font-bold text-gray-900 mb-1">No matching duplicates</h3>
  <p class="text-gray-500 text-sm">Try a different search term.</p>
</div>

<!-- Initial Empty State -->
<div id="empty-state" class="hidden bg-white rounded-xl border border-gray-200 p-20 text-center shadow-sm">
  <div class="inline-flex items-center justify-center w-24 h-24 bg-green-50 rounded-full mb-6">
    <i data-lucide="shield-check" class="w-12 h-12 text-highway-green"></i>
  </div>
  <h3 class="text-2xl font-branding font-bold text-gray-900 mb-2">All records are clean!</h3>
  <p class="text-gray-500 max-w-md mx-auto">No records with duplicate values were found across your zones.</p>
</div>

<script>
  const csrfToken = '{{.CSRFToken}}';

  async function loadData() {
    try {
      const response = await fetch('/admin/duplicates/data');
      const data = await response.json();
      
      const skeleton = document.getElementById('skeleton-container');
      const list = document.getElementById('duplicates-list');
      const search = document.getElementById('search-container');
      const empty = document.getElementById('empty-state');
      const counterTotal = document.getElementById('counter-total');
      const counterIgnored = document.getElementById('counter-ignored');

      // Update counters
      counterTotal.textContent = `${data.counters.total} GROUPS FOUND`;
      counterTotal.classList.remove('animate-pulse', 'w-24', 'h-6');
      counterIgnored.textContent = `${data.counters.ignored} IGNORED`;
      counterIgnored.classList.remove('animate-pulse', 'w-24', 'h-6');

      skeleton.classList.add('hidden');

      if (data.duplicates && data.duplicates.length > 0) {
        list.innerHTML = data.duplicates.map(group => renderCard(group)).join('');
        list.classList.remove('hidden');
        search.classList.remove('hidden');
      } else {
        empty.classList.remove('hidden');
      }

      lucide.createIcons();
    } catch (err) {
      console.error('Failed to load duplicates:', err);
      // Fallback or error message could be added here
    }
  }

  function renderCard(group) {
    const recordsHTML = group.Records.map(rec => `
      <div class="flex items-center justify-between gap-4 p-2 rounded-lg hover:bg-gray-50 transition-colors">
        <div class="flex items-center gap-3 min-w-0">
          <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded shadow-sm text-white text-center min-w-[3rem] ${getTypeBadgeClass(rec.Type)}">
            ${rec.Type}
          </span>
          <div class="flex flex-col min-w-0">
            <span class="font-mono text-sm font-medium text-asphalt-dark truncate" title="${rec.Name}">${rec.Name}</span>
            <span class="text-[10px] text-gray-500 uppercase tracking-tight">${rec.ZoneLabel}</span>
          </div>
        </div>
        <a href="/zones/${rec.ZoneID}/records" class="text-gray-400 hover:text-connection-blue transition-colors">
          <i data-lucide="external-link" class="w-4 h-4"></i>
        </a>
      </div>
    `).join('');

    const searchStr = `${group.Value} ${group.Records.map(r => `${r.Name} ${r.Type} ${r.ZoneLabel}`).join(' ')}`.toLowerCase();

    return `
      <div class="duplicate-card bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden hover:border-connection-blue/30 transition-all group"
        data-search="${searchStr}">
        <div class="bg-gray-50 border-b border-gray-100 p-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="bg-caution-yellow/10 p-2 rounded-lg">
              <i data-lucide="copy" class="w-5 h-5 text-amber-600"></i>
            </div>
            <div>
              <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Duplicate Value</span>
              <div class="font-mono text-sm font-bold text-asphalt-dark break-all">${group.Value}</div>
            </div>
          </div>
          <form method="POST" action="/admin/duplicates/ignore" class="opacity-0 group-hover:opacity-100 transition-opacity">
            <input type="hidden" name="csrf_token" value="${csrfToken}">
            <input type="hidden" name="value_hash" value="${group.ValueHash}">
            <input type="hidden" name="value_text" value="${group.Value}">
            <button type="submit" onclick="return confirm('Ignore this duplicate group?')"
              class="text-xs font-bold px-3 py-1.5 rounded-lg bg-white border border-gray-200 text-gray-500 hover:text-red-500 hover:border-red-200 hover:bg-red-50 transition-all flex items-center gap-2">
              <i data-lucide="eye-off" class="w-3.5 h-3.5"></i> Ignore
            </button>
          </form>
        </div>
        <div class="p-4 bg-white">
          <div class="space-y-3">${recordsHTML}</div>
        </div>
      </div>
    `;
  }

  function getTypeBadgeClass(type) {
    switch(type) {
      case 'A': return 'bg-highway-green';
      case 'CNAME': return 'bg-purple-600';
      case 'TXT': return 'bg-gray-500';
      case 'MX': return 'bg-orange-500';
      case 'NS': return 'bg-blue-800';
      default: return 'bg-connection-blue';
    }
  }

  function filterDuplicates(query) {
    const q = query.toLowerCase().trim();
    const cards = document.querySelectorAll('.duplicate-card');
    const container = document.getElementById('duplicates-list');
    const empty = document.getElementById('no-search-results');
    let visible = 0;

    cards.forEach(function (card) {
      const text = (card.dataset.search || '').toLowerCase();
      if (!q || text.includes(q)) {
        card.style.display = '';
        visible++;
      } else {
        card.style.display = 'none';
      }
    });

    if (container) container.style.display = visible ? 'grid' : 'none';
    if (empty) empty.classList.toggle('hidden', visible > 0);
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
{{end}}
